[project]
name = "gcal-glance"
version = "0.1.0"
description = "Google Calendar Glance (GCal Glance) for BUSY Bar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "busylib>=1.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.13",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "watchfiles>=0.21.0",
]

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "PERF"]

[tool.mypy]
python_version = "3.10"
strict = true

[dependency-groups]
dev = [
    "types-python-dateutil>=2.9.0.20260807",
]

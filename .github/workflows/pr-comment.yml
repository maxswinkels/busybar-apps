# Posts the app-check report from CI as a PR comment.
#
# This is a separate workflow on purpose. Pull requests from forks run with a
# read-only token, so the CI job that produces the report cannot post it. A
# `workflow_run` workflow runs in the context of the base repository, where it
# can, without ever giving fork code access to a writable token: it only reads
# an artifact, never checks out or executes the PR's contents.
name: PR comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the report
        uses: actions/download-artifact@v4
        with:
          name: app-check-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Post or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('report.md') || !fs.existsSync('pr-number.txt')) {
              core.info('no report artifact, nothing to comment')
              return
            }
            const issue_number = Number(fs.readFileSync('pr-number.txt', 'utf8').trim())
            if (!issue_number) return
            const marker = '<!-- app-check -->'
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8')
            const { owner, repo } = context.repo
            const existing = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 })
            // Update in place so a PR with several pushes keeps one comment
            // rather than growing a wall of them.
            const mine = existing.find((c) => c.body && c.body.includes(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
